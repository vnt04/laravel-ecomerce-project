services:
  mysql:
    image: mysql:8.0
    container_name: mysql-demo-ecommerce
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demo-ecommerce
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    platform: linux/amd64
    container_name: phpadmin-demo-ecommerce
    environment:
      PMA_HOST: mysql
      PMA_USER: laravel
      PMA_PASSWORD: laravel
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - app-network  


volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge